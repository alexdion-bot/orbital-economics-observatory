<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070F">
<title>Orbital Economics Observatory</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://alexdion-bot.github.io/orbital-economics-observatory/">
<meta property="og:site_name" content="Orbital Economics Observatory">
<meta property="og:title" content="Orbital Economics Observatory">
<meta property="og:description" content="An open estimate of the external cost imposed by every active satellite in low Earth orbit, computed from the GCAT catalogue and checked against the published economics.">
<meta property="og:image" content="https://alexdion-bot.github.io/orbital-economics-observatory/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Orbital Economics Observatory">
<meta name="twitter:description" content="What every satellite in low Earth orbit costs everyone else, priced from the public catalogue.">
<meta name="twitter:image" content="https://alexdion-bot.github.io/orbital-economics-observatory/social-card.png">
<meta name="description" content="An open estimate of the external cost imposed by every active satellite in low Earth orbit, computed from the GCAT catalogue and checked against the published economics.">
<link rel="canonical" href="https://alexdion-bot.github.io/orbital-economics-observatory/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04070F;
  --deep:#070C17;
  --panel:#0A121F;
  --panel2:#0D1727;
  --rule:#16233A;
  --rule2:#25384F;
  --ink:#EEF3FA;
  --dim:#93A5BE;
  --faint:#5C6E88;
  --blue:#2C6BE8;
  --blue-hi:#6AA0FF;
  --blue-deep:#12356F;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--void);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.62;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:var(--blue-hi);text-decoration:none;border-bottom:1px solid rgba(106,160,255,.28)}
a:hover{border-bottom-color:var(--blue-hi)}
:focus-visible{outline:1px solid var(--blue-hi);outline-offset:3px}
::selection{background:rgba(44,107,232,.35)}

/* ============ masthead ============ */
.mast{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(4,7,15,.72);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1560px;margin:0 auto;padding:0 clamp(20px,3vw,44px);height:64px;display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
.brand{font-weight:600;font-size:15.5px;letter-spacing:-.025em;white-space:nowrap;color:var(--ink)}
.brand em{font-style:normal;color:var(--blue-hi)}
nav{display:flex;gap:0;margin-left:auto}
nav button{
  background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.lang{display:flex;margin-left:clamp(10px,2vw,26px);border:1px solid var(--rule);flex:none}
.lang button{
  background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;padding:6px 10px;cursor:pointer;transition:color .18s,background .18s;
}
.lang button[aria-pressed="true"]{color:var(--void);background:var(--ink)}

/* ============ views ============ */
main{padding-top:var(--mast,64px)}
.view{display:none}
.view.on{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,3vw,44px) clamp(80px,10vw,140px)}
.wrap.wide{max-width:1560px}

/* ============ hero ============ */
#orbit{position:relative;height:calc(100svh - var(--mast,64px));min-height:620px;overflow:hidden;border-bottom:1px solid var(--rule)}
#stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage canvas{display:block;width:100%!important;height:100%!important}
.vign{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(120% 90% at 78% 46%,rgba(20,53,111,.20),transparent 62%),
    linear-gradient(90deg,rgba(4,7,15,.94) 0%,rgba(4,7,15,.72) 26%,rgba(4,7,15,0) 52%);
}
.hero{
  position:absolute;left:0;top:0;bottom:0;z-index:5;
  width:min(600px,50vw);padding:0 0 0 clamp(20px,4vw,72px);
  display:flex;flex-direction:column;justify-content:center;pointer-events:none;
}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:clamp(18px,3vh,32px);display:flex;align-items:center;gap:11px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--blue);flex:none}
.eyebrow b{color:var(--dim);font-weight:400}
.figure{
  font-weight:700;font-size:clamp(42px,7vw,112px);line-height:.88;letter-spacing:-.045em;
  color:var(--ink);font-variant-numeric:tabular-nums;
}
.figure-unit{font-weight:500;font-size:clamp(15px,1.5vw,21px);color:var(--blue-hi);letter-spacing:-.012em;margin-top:clamp(12px,1.6vh,20px)}
.lede{margin-top:clamp(18px,2.6vh,30px);font-size:clamp(13.5px,1.05vw,16px);color:var(--dim);max-width:46ch;line-height:1.68}
.hero-cta{margin-top:clamp(22px,3vh,34px);pointer-events:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 17px;border:1px solid var(--rule2);background:rgba(10,18,31,.6);color:var(--dim);
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;backdrop-filter:blur(6px);
}
.btn:hover{border-color:var(--blue);color:var(--ink)}
.btn.on{border-color:var(--blue);background:rgba(44,107,232,.14);color:var(--ink)}

/* zoom instruments */
.zoomctl{position:absolute;right:clamp(16px,2.2vw,34px);bottom:clamp(20px,3vh,36px);z-index:8;display:flex;flex-direction:column;border:1px solid var(--rule)}
.zoomctl button{
  width:32px;height:32px;background:rgba(10,18,31,.72);border:0;border-bottom:1px solid var(--rule);
  color:var(--dim);font-family:var(--mono);font-size:13px;cursor:pointer;transition:color .15s,background .15s;backdrop-filter:blur(6px);
}
.zoomctl button:last-child{border-bottom:0;font-size:9px;letter-spacing:.08em}
.zoomctl button:hover{color:var(--ink);background:rgba(44,107,232,.2)}

/* altitude ladder */
.ladder{position:absolute;right:clamp(16px,2.2vw,34px);top:50%;transform:translateY(-50%);width:186px;z-index:6}
.ladder-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;text-align:right}
.rung{display:flex;align-items:center;gap:8px;height:10px;cursor:pointer;justify-content:flex-end}
.rung .bar{height:1px;background:var(--blue-deep);transition:background .14s,height .14s}
.rung .alt{font-family:var(--mono);font-size:9px;color:#3F5064;width:32px;text-align:right;flex:none;transition:color .14s}
.rung:hover .bar,.rung.sel .bar{background:var(--blue-hi);height:3px}
.rung:hover .alt,.rung.sel .alt{color:var(--ink)}
.ladder-f{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:12px;text-align:right;line-height:1.7}

/* inspector */
.inspect{
  position:absolute;left:clamp(20px,4vw,72px);bottom:clamp(20px,4vh,44px);width:min(392px,42vw);
  background:rgba(7,12,23,.93);backdrop-filter:blur(16px);border:1px solid var(--rule2);z-index:9;display:none;
}
.inspect.on{display:block}
.inspect-h{padding:11px 17px;border-bottom:1px solid var(--rule);display:flex;align-items:center}
.inspect-h .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.inspect-h .x{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.inspect-h .x:hover{color:var(--ink)}
.inspect-b{padding:16px 17px 18px}
.sat-name{font-weight:600;font-size:20px;letter-spacing:-.025em;margin-bottom:3px}
.sat-op{font-size:12.5px;color:var(--blue-hi);margin-bottom:16px}
.rows{display:grid;grid-template-columns:1fr auto;gap:7px 18px;font-size:12.5px}
.rows dt{color:var(--dim)}
.rows dd{font-family:var(--mono);text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}
.rows dd.hi{color:var(--blue-hi)}
.divider{height:1px;background:var(--rule);margin:16px 0}
.op-tot{font-weight:700;font-size:27px;color:var(--blue-hi);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.op-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}

/* scroll cue */
.cue{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--faint);transition:color .2s}
.cue:hover{color:var(--ink)}
.cue span{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase}
.cue i{width:1px;height:28px;background:linear-gradient(to bottom,currentColor,transparent);animation:drop 2.6s ease-in-out infinite}
@keyframes drop{0%,100%{opacity:.2;transform:translateY(-5px)}50%{opacity:1;transform:translateY(4px)}}
.hint{position:absolute;left:clamp(20px,4vw,72px);bottom:clamp(20px,4vh,44px);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#3F5064;z-index:4;pointer-events:none;transition:opacity .6s}

/* ============ scroll bands ============ */
.band{border-bottom:1px solid var(--rule);padding:clamp(64px,9vw,132px) clamp(20px,3vw,44px)}
.band.alt{background:linear-gradient(180deg,var(--deep),var(--void))}
.band-in{max-width:1400px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--blue-hi);margin-bottom:22px;display:flex;align-items:center;gap:11px}
.kicker::before{content:"";width:20px;height:1px;background:var(--blue);flex:none}
.band h2{font-weight:600;font-size:clamp(27px,3.6vw,50px);line-height:1.06;letter-spacing:-.04em;max-width:19ch;margin-bottom:20px}
.band-sub{color:var(--dim);font-size:clamp(14px,1.05vw,16.5px);max-width:62ch;line-height:1.68}

/* simulator */
.sim{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,4vw,66px);align-items:start;margin-top:clamp(38px,5vw,64px)}
.sim-cap{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.sim-total{font-weight:700;font-size:clamp(32px,4.4vw,62px);letter-spacing:-.05em;line-height:.96;color:var(--blue-hi);font-variant-numeric:tabular-nums;margin-bottom:clamp(28px,3.2vw,44px)}
.sim-range{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--rule2);outline:none;margin:0;cursor:pointer}
.sim-range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--blue-hi);cursor:grab;box-shadow:0 0 0 5px rgba(44,107,232,.20)}
.sim-range::-webkit-slider-thumb:active{cursor:grabbing;box-shadow:0 0 0 8px rgba(44,107,232,.26)}
.sim-range::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--blue-hi);cursor:grab;box-shadow:0 0 0 5px rgba(44,107,232,.20)}
.sim-range::-moz-range-track{height:2px;background:transparent}
.sim-range:focus-visible{outline:1px solid var(--blue-hi);outline-offset:8px}
.sim-track{position:relative;padding-top:44px}
.sim-bubble{
  position:absolute;top:0;left:0;transform:translateX(-50%);
  display:flex;align-items:baseline;gap:5px;white-space:nowrap;pointer-events:none;
  padding:6px 11px;background:var(--panel2);border:1px solid var(--rule2);
  transition:border-color .16s,background .16s,color .16s;
}
.sim-bubble b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.sim-bubble span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sim-bubble::after{
  content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--rule2);
}
.sim-bubble.live{border-color:var(--blue);background:rgba(44,107,232,.20)}
.sim-bubble.live::after{border-top-color:var(--blue)}
.sim-bubble.live b{color:var(--blue-hi)}
.sim-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:13px;letter-spacing:.08em}
.sim-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.sim-presets button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;border:1px solid var(--rule2);background:var(--panel);color:var(--dim);cursor:pointer;transition:border-color .16s,color .16s,background .16s}
.sim-presets button:hover{border-color:var(--blue);color:var(--ink)}
.sim-presets button.on{border-color:var(--blue);background:rgba(44,107,232,.14);color:var(--ink)}
.sim-rows{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:13px;margin-top:clamp(26px,3vw,38px);border-top:1px solid var(--rule);padding-top:20px}
.sim-rows dt{color:var(--faint)}
.sim-rows dd{font-family:var(--mono);text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.sim-right svg{width:100%;height:auto;display:block}

/* shell simulator */
.shsim{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(30px,4vw,66px);align-items:start;margin-top:clamp(38px,5vw,64px)}
.shrow{margin-bottom:clamp(30px,3.4vw,44px)}
.shrow:last-of-type{margin-bottom:0}
.shsel{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px}
.shsel .l{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.shsel .v{font-family:var(--mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.shsel .v.hi{color:var(--blue-hi)}
.shbig{font-weight:700;font-size:clamp(30px,4vw,56px);letter-spacing:-.05em;line-height:.96;color:var(--blue-hi);font-variant-numeric:tabular-nums}
.shcap{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.shrows{display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:13px;margin-top:clamp(24px,2.8vw,34px);border-top:1px solid var(--rule);padding-top:20px}
.shrows dt{color:var(--faint)}
.shrows dd{font-family:var(--mono);text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.shrows dd.up{color:var(--blue-hi)}
.shrows dd.dn{color:#7FB99B}
.shreset{margin-top:22px}
.shsim-right svg{width:100%;height:auto;display:block}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:clamp(38px,5vw,64px)}
.pod{background:var(--panel);padding:clamp(22px,2.3vw,34px);position:relative;text-align:left;border:0;font-family:inherit;color:inherit;cursor:pointer;transition:background .22s;display:block;width:100%}
.pod:hover{background:var(--panel2)}
.pod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--rule2);transition:background .22s}
.pod:hover::before{background:var(--blue)}
.pod.first{background:linear-gradient(165deg,rgba(44,107,232,.13),rgba(10,18,31,0) 58%),var(--panel)}
.pod.first::before{background:var(--blue)}
.pod-r{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);margin-bottom:clamp(20px,2.4vw,34px)}
.pod-n{font-weight:600;font-size:clamp(19px,1.75vw,25px);letter-spacing:-.032em;line-height:1.16;margin-bottom:4px}
.pod-c{font-size:12px;color:var(--faint);margin-bottom:clamp(18px,2.2vw,30px)}
.pod-v{font-weight:700;font-size:clamp(26px,2.9vw,42px);letter-spacing:-.045em;color:var(--blue-hi);font-variant-numeric:tabular-nums;line-height:1}
.pod.first .pod-v{color:var(--ink)}
.pod-u{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.pod-track{height:2px;background:var(--rule2);margin:clamp(20px,2.4vw,30px) 0 9px;overflow:hidden}
.pod-fill{height:100%;background:var(--blue)}
.pod.first .pod-fill{background:var(--blue-hi)}
.pod-share{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-bottom:clamp(18px,2.2vw,28px)}
.pod-rows{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:12.5px;border-top:1px solid var(--rule);padding-top:16px}
.pod-rows dt{color:var(--faint)}
.pod-rows dd{font-family:var(--mono);text-align:right;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.rest{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border:1px solid var(--rule);border-top:0;background:var(--deep);padding:20px clamp(22px,2.3vw,34px)}
.rest .l{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.rest .v{font-weight:600;font-size:19px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-left:auto}
.rest .s{font-family:var(--mono);font-size:11px;color:var(--dim)}
.podnote{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:16px}

/* shell strip */
.striprow{display:grid;grid-template-columns:1fr 300px;gap:clamp(30px,4vw,64px);align-items:end;margin-top:clamp(38px,5vw,64px)}
.strip{display:flex;align-items:flex-end;gap:2px;height:190px;border-bottom:1px solid var(--rule2)}
.sb{flex:1;background:var(--blue-deep);min-height:1px;cursor:pointer;transition:background .16s;position:relative}
.sb:hover{background:var(--blue-hi)}
.sb.max{background:var(--blue-hi)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:9px;letter-spacing:.08em}
.peak{border-left:1px solid var(--rule2);padding-left:clamp(20px,2.4vw,32px)}
.peak-h{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.peak-v{font-weight:700;font-size:clamp(30px,3.2vw,44px);letter-spacing:-.045em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.peak-u{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-hi);margin-top:9px}
.peak-rows{display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:12.5px;margin-top:26px;border-top:1px solid var(--rule);padding-top:18px}
.peak-rows dt{color:var(--faint)}
.peak-rows dd{font-family:var(--mono);text-align:right;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* split band */
.split{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:clamp(38px,5vw,64px)}
.spl{background:var(--panel);padding:clamp(26px,3vw,44px)}
.spl .l{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:18px}
.spl .v{font-weight:700;font-size:clamp(38px,5.2vw,76px);letter-spacing:-.05em;line-height:.94;font-variant-numeric:tabular-nums}
.spl.a .v{color:var(--faint)}
.spl.b .v{color:var(--blue-hi)}
.spl .d{color:var(--dim);font-size:13.5px;margin-top:16px;max-width:40ch;line-height:1.65}
.spl .m{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:12px}

.bandcta{display:flex;gap:9px;flex-wrap:wrap;margin-top:clamp(34px,4vw,52px)}

/* ============ prose ============ */
h2.sec{font-weight:600;font-size:clamp(28px,3.6vw,46px);letter-spacing:-.04em;line-height:1.08}
h3{font-weight:600;font-size:clamp(19px,1.7vw,24px);letter-spacing:-.028em;margin:clamp(38px,4vw,58px) 0 12px;max-width:30ch}
h4{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-hi);margin:clamp(34px,4vw,52px) 0 14px;font-weight:500}
.sub{color:var(--dim);font-size:clamp(15px,1.15vw,17.5px);max-width:64ch;line-height:1.66}
p{max-width:66ch;margin-bottom:15px;color:#BCCADB;line-height:1.72}
p strong{color:var(--ink);font-weight:600}
ul{max-width:66ch;margin:0 0 16px 18px}
li{margin-bottom:9px;color:#BCCADB}
.note{border-left:1px solid var(--blue);background:linear-gradient(90deg,rgba(44,107,232,.07),transparent 70%);padding:16px 20px;color:var(--dim);font-size:13.5px;max-width:64ch;margin:22px 0;line-height:1.7}
.sechead{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:clamp(24px,3vw,38px)}
.sechead .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.2em}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:clamp(28px,3.4vw,44px) 0 clamp(34px,4vw,52px)}
.stat{background:var(--panel);padding:22px 20px}
.stat .v{font-weight:700;font-size:28px;letter-spacing:-.042em;font-variant-numeric:tabular-nums}
.stat .v.c{color:var(--blue-hi)}
.stat .v.t{color:var(--ink)}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:9px;line-height:1.6}

/* tables */
.tbl-wrap{border:1px solid var(--rule);overflow:auto;max-height:580px;margin:22px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:2;font-weight:500}
td{padding:9px 12px;border-bottom:1px solid rgba(22,35,58,.6);color:#BCCADB}
tbody tr:hover{background:rgba(44,107,232,.07)}
td.num{font-family:var(--mono);text-align:right;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.hi{color:var(--blue-hi)}
.search{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--rule);color:var(--ink);font-family:var(--mono);font-size:12px;padding:11px 13px;margin-bottom:6px}
.search:focus{border-color:var(--blue);outline:none}

/* downloads */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:22px 0}
.dl a{background:var(--panel);padding:18px 20px;border:0;display:block;color:var(--ink);transition:background .18s}
.dl a:hover{background:var(--panel2)}
.dl .f{font-family:var(--mono);font-size:12px;color:var(--blue-hi);margin-bottom:5px}
.dl .d{font-size:12px;color:var(--dim);line-height:1.55}

.eq{background:var(--panel);border:1px solid var(--rule);border-left:1px solid var(--blue);padding:16px 20px;font-family:var(--mono);font-size:12.5px;color:var(--ink);margin:18px 0;overflow-x:auto;max-width:66ch;line-height:1.8}
.eq .c{color:var(--faint);display:block;font-size:11px;margin-top:9px;line-height:1.8}

.card-person{position:relative;border:1px solid var(--rule);background:linear-gradient(165deg,rgba(44,107,232,.11),rgba(10,18,31,0) 62%),var(--panel);padding:clamp(26px,3vw,44px);margin:clamp(28px,3.4vw,46px) 0 clamp(10px,1.4vw,18px);max-width:66ch}
.card-person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--blue)}
.cp-name{font-weight:700;font-size:clamp(26px,3vw,40px);letter-spacing:-.045em;line-height:1;color:var(--ink)}
.cp-role{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:13px}
.cp-link{display:inline-flex;align-items:center;gap:10px;margin-top:clamp(22px,2.6vw,34px);border:1px solid var(--rule2);background:rgba(13,23,39,.7);padding:12px 17px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:border-color .16s,color .16s,background .16s}
.cp-link:hover{border-color:var(--blue);color:var(--ink);background:rgba(44,107,232,.14)}
.cp-link::after{content:"\2197";font-size:13px;letter-spacing:0;line-height:1}

footer{border-top:1px solid var(--rule);padding:44px clamp(20px,3vw,44px) 72px;text-align:center;background:var(--deep)}
footer p{max-width:none;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:2}

@media (max-width:1120px){ .ladder{display:none} .hero{width:min(560px,60vw)} }
@media (max-width:900px){
  .podium{grid-template-columns:1fr}
  .striprow{grid-template-columns:1fr;align-items:stretch}
  .peak{border-left:0;border-top:1px solid var(--rule2);padding-left:0;padding-top:26px}
  .split{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .shsim{grid-template-columns:1fr}
  #orbit{height:auto;min-height:0;display:flex;flex-direction:column}
  .hero{order:1;position:relative;width:100%;height:auto;padding:clamp(26px,5vh,48px) clamp(20px,5vw,32px) 0;justify-content:flex-start}
  #stage{order:2;position:relative;height:52vh;min-height:300px;margin-top:clamp(20px,4vh,34px)}
  .zoomctl{order:3;position:static;flex-direction:row;align-self:flex-end;width:max-content;margin:12px clamp(20px,5vw,32px) 0}
  .zoomctl button{border-bottom:0;border-right:1px solid var(--rule);width:40px;height:40px}
  .zoomctl button:last-child{border-right:0}
  .inspect{order:4;position:relative;left:auto;bottom:auto;width:auto;margin:18px clamp(20px,5vw,32px) 4px}
  .vign,.hint,.cue{display:none}
  .strip{gap:1px;height:150px}
}
/* --- masthead on narrow screens, two rows with a scrollable tab strip --- */
@media (max-width:820px){
  .mast-in{height:auto;flex-wrap:wrap;gap:0;padding:0}
  .brand{order:1;flex:1 1 auto;min-width:0;white-space:normal;padding:11px 0 9px clamp(16px,4vw,24px);font-size:14.5px;line-height:1.25}
  .lang{order:2;flex:none;margin:9px clamp(16px,4vw,24px) 0 12px}
  nav{order:3;flex:1 0 100%;margin:0;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--rule);
      scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:12px 15px;font-size:10px;letter-spacing:.14em}
  nav button:first-child{padding-left:clamp(16px,4vw,24px)}
  nav button:last-child{padding-right:clamp(16px,4vw,24px)}
}
@media (max-width:430px){
  .figure{font-size:34px}
  .brand{font-size:13.5px}
  .wrap,.band{padding-left:18px;padding-right:18px}
  .sim-total,.shbig{font-size:29px}
  .pod-v{font-size:27px}
  .spl .v{font-size:38px}
  .stat .v{font-size:24px}
  th,td{padding:9px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <div class="brand">Orbital Economics <em>Observatory</em></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-v="orbit" data-i="tabOrbit">Orbit</button>
      <button role="tab" aria-selected="false" data-v="findings" data-i="tabFind">Findings</button>
      <button role="tab" aria-selected="false" data-v="data" data-i="tabData">Data</button>
      <button role="tab" aria-selected="false" data-v="method" data-i="tabMethod">Method</button>
      <button role="tab" aria-selected="false" data-v="limits" data-i="tabLimits">Limits</button>
      <button role="tab" aria-selected="false" data-v="contact" data-i="tabContact">Contact</button>
    </nav>
    <div class="lang">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>
</header>

<main>

<!-- ================= ORBIT ================= -->
<section class="view on" id="v-orbit">

  <div id="orbit">
    <div id="stage"></div>
    <div class="vign"></div>

    <div class="hero">
      <div class="eyebrow"><span data-i="eyeLeo">Low Earth orbit</span> <b id="snap"></b></div>
      <div class="figure" id="bigfig"></div>
      <div class="figure-unit" data-i="figUnit"></div>
      <p class="lede" data-i="lede"></p>
      <div class="hero-cta">
        <button class="btn" id="btn-iso"></button>
        <button class="btn" data-goto="method" data-i="ctaMethod"></button>
      </div>
    </div>

    <div class="ladder" id="ladder">
      <div class="ladder-h" data-i="ladderH"></div>
      <div id="rungs"></div>
      <div class="ladder-f" data-i="ladderF"></div>
    </div>

    <div class="zoomctl">
      <button id="z-in" aria-label="Zoom in">+</button>
      <button id="z-out" aria-label="Zoom out">&minus;</button>
      <button id="z-reset" aria-label="Reset view">RST</button>
    </div>

    <div class="inspect" id="inspect">
      <div class="inspect-h">
        <span class="k" id="ins-kind"></span>
        <button class="x" id="ins-close" aria-label="Close">&times;</button>
      </div>
      <div class="inspect-b" id="ins-body"></div>
    </div>

    <div class="hint" id="hint" data-i="hint"></div>
    <button class="cue" id="cue"><span data-i="cue"></span><i></i></button>
  </div>

  <!-- ---- band 1 : the simulator ---- -->
  <section class="band" id="band-sim">
    <div class="band-in">
      <div class="kicker" data-i="simKicker"></div>
      <h2 data-i="simHead"></h2>
      <p class="band-sub" data-i="simSub"></p>
      <div class="sim">
        <div class="sim-left">
          <div class="sim-cap" data-i="simLTotal"></div>
          <div class="sim-total" id="sim-total"></div>
          <div class="sim-track">
            <div class="sim-bubble" id="sim-bubble"><b id="sim-bub-n"></b><span id="sim-bub-u"></span></div>
            <input class="sim-range" type="range" id="sim-range" min="1000" max="60000" step="250" value="15493">
          </div>
          <div class="sim-scale"><span id="sim-min"></span><span id="sim-max"></span></div>
          <div class="sim-presets" id="sim-presets"></div>
          <dl class="sim-rows" id="sim-rows"></dl>
        </div>
        <div class="sim-right" id="sim-curve"></div>
      </div>
      <div class="podnote" data-i="simNote"></div>
    </div>
  </section>

  <!-- ---- band 2 : the per shell simulator ---- -->
  <section class="band alt" id="band-shell">
    <div class="band-in">
      <div class="kicker" data-i="shKicker"></div>
      <h2 data-i="shHead"></h2>
      <p class="band-sub" data-i="shSub"></p>
      <div class="shsim">
        <div class="shsim-left">
          <div class="shrow">
            <div class="shsel"><span class="l" data-i="shAltL"></span><span class="v hi" id="sh-alt"></span></div>
            <input class="sim-range" type="range" id="sh-shell" min="1" max="40" step="1" value="8">
            <div class="sim-scale"><span>200 km</span><span>1600 km</span></div>
          </div>
          <div class="shrow">
            <div class="shsel"><span class="l" data-i="shSatL"></span><span class="v" id="sh-n"></span></div>
            <input class="sim-range" type="range" id="sh-count" min="0" max="10000" step="25" value="5184">
            <div class="sim-scale"><span>0</span><span id="sh-now"></span><span>10 000</span></div>
          </div>
          <div class="shcap" data-i="shPerSatL"></div>
          <div class="shbig" id="sh-persat"></div>
          <dl class="shrows" id="sh-rows"></dl>
          <div class="shreset"><button class="btn" id="sh-reset" data-i="shReset"></button></div>
        </div>
        <div class="shsim-right" id="sh-curve"></div>
      </div>
      <div class="podnote" data-i="shNote"></div>
    </div>
  </section>

  <!-- ---- band 3 : the ranking ---- -->
  <section class="band" id="band-rank">
    <div class="band-in">
      <div class="kicker" data-i="rankKicker"></div>
      <h2 data-i="rankHead"></h2>
      <p class="band-sub" id="rank-sub"></p>
      <div class="podium" id="podium"></div>
      <div class="rest" id="rest"></div>
      <div class="podnote" data-i="rankClick"></div>
    </div>
  </section>

  <!-- ---- band 2 : the contaminated shell ---- -->
  <section class="band">
    <div class="band-in">
      <div class="kicker" data-i="dirtyKicker"></div>
      <h2 data-i="dirtyHead"></h2>
      <p class="band-sub" id="dirty-sub"></p>
      <div class="striprow">
        <div>
          <div class="strip" id="strip"></div>
          <div class="axis"><span>200</span><span>550</span><span>900</span><span>1250</span><span>1600</span></div>
          <div class="podnote" data-i="dirtyAxis"></div>
        </div>
        <div class="peak">
          <div class="peak-h" data-i="dirtyPeakH"></div>
          <div class="peak-v" id="peak-v"></div>
          <div class="peak-u" id="peak-u"></div>
          <dl class="peak-rows" id="peak-rows"></dl>
        </div>
      </div>
    </div>
  </section>

  <!-- ---- band 3 : the split ---- -->
  <section class="band alt">
    <div class="band-in">
      <div class="kicker" data-i="splitKicker"></div>
      <h2 data-i="splitHead"></h2>
      <p class="band-sub" data-i="splitSub"></p>
      <div class="split" id="split"></div>
      <div class="bandcta">
        <button class="btn" data-goto="findings" data-i="ctaFind"></button>
        <button class="btn" data-goto="data" data-i="ctaData"></button>
      </div>
    </div>
  </section>

</section>

<!-- ================= FINDINGS ================= -->
<section class="view" id="v-findings">
  <div class="wrap">
    <div class="sechead"><span class="n">01</span><h2 class="sec" data-i="f0h"></h2></div>
    <p class="sub" data-i="f0s"></p>
    <div class="stats" id="stat-strip"></div>

    </table></div>
    <p data-i="f1c"></p>
    <div class="note" data-i="f1n"></div>

    <h3 data-i="f2h"></h3>

      <thead><tr><th data-i="thEstimate"></th><th style="text-align:right" data-i="thPerSat2"></th></tr></thead>
      <tbody id="valid-rows"></tbody>

    <p data-i="f2b"></p>

    <h3 data-i="f3h"></h3>
    <p id="f3a"></p>
    <p data-i="f3b"></p>

    <h3 data-i="f4h"></h3>

    <p data-i="f4b"></p>

  if(s.charCodeAt(0)===126){ return S.prefixes[parseInt(s[1],16)] + s.slice(2); }
  return s;
});
function tidy(n){
  var s = String(n||''), i = s.indexOf(' (');
  if(i>0){
    var rest = s.slice(i), head = s.slice(0,i);
    var tail = rest.slice(2).replace(/\)$/,'');
    if(rest.indexOf(')')<0 || head.toLowerCase().indexOf(tail.toLowerCase().split(' ')[0])>=0) s = head;
  }
  return s.replace(/[,\s]+$/,'').trim();
}
function shortName(n){ return tidy(n).split(' (')[0].replace(/,.*$/,'').trim(); }

/* ---------------- formatting ---------------- */
function loc(){ return LANG==='fr' ? 'fr-FR' : 'en-US'; }
function money(n){
  var v = Math.round(n).toLocaleString(loc());
  return LANG==='fr' ? v+' $' : '$'+v;
}
function moneyShort(n){
  var v;
  if(n>=1e9){ v=n/1e9; v=dec(v, v>=100?0:(v>=10?1:2)); return LANG==='fr'? v+' Md$' : '$'+v+'bn'; }
  if(n>=1e6){ v=n/1e6; v=dec(v, v>=100?0:1); return LANG==='fr'? v+' M$' : '$'+v+'m'; }
  if(n>=1e3){ v=num(Math.round(n/1e3)); return LANG==='fr'? v+' k$' : '$'+v+'k'; }
  return money(n);
}
function num(n){ return n.toLocaleString(loc()); }
function dec(n,d){ var s=n.toFixed(d); return LANG==='fr'? s.replace('.',',') : s; }
function pct(n,d){ if(d===undefined) d=2; return dec(n*100,d) + (LANG==='fr'?' %':'%'); }
var M_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var M_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function snapDate(){
  var m = /^(\d+)\s+([A-Za-z]+)\s+(\d{4})$/.exec(D.snapshot);
  if(!m) return D.snapshot;
  var i = M_EN.map(function(x){return x.toLowerCase();}).indexOf(m[2].toLowerCase());
  if(i<0) return D.snapshot;
  return LANG==='fr' ? (m[1]+' '+M_FR[i]+' '+m[3]) : D.snapshot;
}

 m1a:'Every object comes from <a href="https://planet4589.org/space/gcat" target="_blank" rel="noopener">GCAT</a>, the General Catalog of Artificial Space Objects maintained by Jonathan McDowell, under a CC BY licence. Six files are used, the current catalogue, the full historical catalogue, the payload catalogue, the launch log, the organisation table and the active object list, the last of these serving as an independent cross-check.',

 m2a:'Low Earth orbit is divided into <strong>40 shells of 35 km</strong> between 200 and 1600 km. This division follows MOCAT 4S and the OPUS integrated assessment model, which makes the counts directly comparable with the published literature.',
 m2b:'Objects are sorted into five operational classes. The decisive distinction separates an <strong>active payload</strong> from a <strong>derelict one</strong>. GCAT records it, and it matters because a satellite that is no longer operating cannot manoeuvre and behaves like debris.',

 m3a:'Risk is computed from kinetic theory. A satellite sweeps a volume, and the rate at which it encounters another object equals the spatial density of those objects multiplied by the collision cross-section and by the relative velocity.',
 eq1c:'D is the number of inert objects in the shell, V its volume, \u03C3 the collision cross-section, v the relative velocity of 10 km/s, \u03B1 the fraction not avoided by manoeuvring and \u03B4 the number of lethal untracked fragments per catalogued object.',
 m3b:'The parameter \u03B4 weighs heavily on the result. Surveillance networks track objects down to roughly ten centimetres, while a one-centimetre fragment travelling at ten kilometres a second will destroy a satellite. MOCAT 4S assumes ten lethal untracked objects for every catalogued one, and omitting that factor lowers the collision-avoidance weighting applied to an inert object by a factor of about fifty.',
 m3c:'The annual probability follows from the rate by treating encounters as a Poisson process.',
 m4h:'The value of a satellite',
 m4a:'Converting a risk into an amount requires the value destroyed in a collision. It comes from the OPUS cost function, reimplemented here from its published specification, and combines the price of launch, the delta-v budget required to hold station against atmospheric drag, and the operating life given up to the end-of-mission deorbit burn. It depends on altitude, which is what makes a price per shell possible.',
 m4n:'This reimplementation revealed a unit inconsistency in the published OPUS code, which computes drag delta-v in km/s and then adds a margin expressed in m/s. The implementation used here follows Table 2 of the paper, in metres per second throughout, and can be checked against a known external quantity. It predicts 59 m/s per year of drag compensation at 400 km, against the 35 to 40 m/s per year NASA reports for International Space Station reboost. The two are not strictly comparable, since the representative satellite has a lower ballistic coefficient than the station and should therefore need somewhat more, so this is an order of magnitude check rather than a match.',
 m5h:'The charge',
 m5a:'The Pigouvian charge is the external cost a satellite imposes without bearing it. Adding a satellite to a shell raises the collision probability faced by every satellite already there, through both channels at once.',
 m6h:'Validation checks',
 m6a:'The pipeline runs 29 automated checks across four stages and stops as soon as one of them fails. Four substantive errors were identified this way, including one that placed the 1,895 derelict payloads in this altitude range on the wrong side of the risk equation, and one that dated debris fragments to the launch of their parent object rather than to the fragmentation event that produced them, which inflated historical debris counts by a factor of 2.6.',
 m6b:'The historical reconstruction is validated against the series published by Rao, Burgess and Kaffine for the period 1957 to 2015. Median agreement over 1990 to 2015 is 0.96 for payloads in orbit and 1.26 for debris fragments.',

 f3a:function(rao,kin){ return 'Repris tel quel sur l\u2019orbite d\u2019aujourd\u2019hui, le modèle agrégé de Rao, Burgess et Kaffine donne une probabilité annuelle de collision de <strong>'+rao+'</strong> par satellite, là où le calcul cinétique donne <strong>'+kin+'</strong>. L\u2019écart passe le facteur trois cents.'; },
 f3b:'Rien de fautif dans leur travail. Leur forme fonctionnelle a été ajustée sur des données qui s\u2019arrêtent en 2015, quand l\u2019orbite comptait moins de deux mille satellites, contre plus de quinze mille aujourd\u2019hui. Sortie sept fois de la plage sur laquelle elle a été estimée, la courbe part, ce qui plaide précisément pour une nouvelle calibration sur des données récentes.',
 f4h:'Le coût se concentre sur un seul opérateur',
 f4b:'Cette concentration ne tient pas qu\u2019au nombre de satellites. Le coût unitaire dépend de l\u2019endroit où l\u2019on vole, et les couches basses, denses et de faible volume sont les plus chères à occuper. C\u2019est précisément là que se trouve la plus grande constellation.',
 concText:function(a,b,c,d,e,f,g,h){ return '<strong>'+a+'</strong> exploite '+b+' des '+c+' satellites actifs en orbite basse et supporte à ce titre <strong>'+d+'</strong> des coûts externes, soit '+e+' par an quand l\u2019opérateur suivant en représente '+f+'. Son coût unitaire, '+g+' par an, dépasse lui aussi les '+h+' de ce dernier.'; },

 m0h:'Comment le calcul est mené',
 m0s:'Le calcul passe par quatre étapes. Chacune est validée avant que la suivante démarre, et tout s\u2019arrête dès qu\u2019un contrôle échoue.',
 m1h:'D\u2019où viennent les données',
 m1a:'Tous les objets viennent de <a href="https://planet4589.org/space/gcat" target="_blank" rel="noopener">GCAT</a>, le General Catalog of Artificial Space Objects tenu par Jonathan McDowell, sous licence CC BY. Six fichiers sont utilisés, le catalogue courant, le catalogue historique complet, celui des charges utiles, le journal des lancements, la table des organisations, et enfin la liste des objets actifs qui sert de recoupement indépendant.',
 m1n:function(s){ return 'Données GCAT (J. McDowell, planet4589.org/space/gcat), arrêtées au '+s+'. Comme GCAT évolue en permanence, la date de l\u2019extraction fait partie du résultat.'; },
 m2h:'Le découpage de l\u2019orbite',
 m2a:'L\u2019orbite basse est découpée en <strong>40 couches de 35 km</strong> entre 200 et 1600 km. Le découpage n\u2019a rien d\u2019arbitraire, c\u2019est celui de MOCAT 4S et du modèle OPUS, ce qui rend chaque effectif directement comparable aux travaux publiés.',
 m2b:'Les objets se rangent en cinq classes. Celle qui compte vraiment sépare la <strong>charge utile active</strong> de la <strong>charge utile abandonnée</strong>. GCAT note la différence, et elle est décisive, car un satellite hors service ne manœuvre plus et se comporte dès lors comme un débris.',
 m3h:'Le risque de collision',
 m3a:'Le risque se calcule par la théorie cinétique. Un satellite balaie un volume, et la fréquence à laquelle il croise un autre objet vaut la densité de ces objets, multipliée par la section efficace de collision et par la vitesse relative.',
 eq1c:'D est le nombre d\u2019objets inertes dans la couche, V son volume, \u03C3 la section efficace de collision, v la vitesse relative de 10 km/s, \u03B1 la part des rencontres qu\u2019aucune manœuvre n\u2019évite, et \u03B4 le nombre de fragments létaux non suivis pour chaque objet catalogué.',
 m3b:'Le paramètre \u03B4 pèse lourd dans le résultat. Les radars de surveillance descendent jusqu\u2019à une dizaine de centimètres, alors qu\u2019un éclat d\u2019un centimètre lancé à dix kilomètres par seconde détruit déjà un satellite. MOCAT 4S retient dix objets létaux non suivis pour chaque objet catalogué, et s\u2019en passer divise par cinquante environ le poids attribué à un objet inerte dans le calcul du risque.',
 m3c:'La probabilité annuelle se déduit de cette fréquence en traitant les rencontres comme un processus de Poisson.',
 m4h:'Ce que vaut un satellite',
 m4a:'Traduire un risque en euros suppose de savoir ce qu\u2019une collision détruit. La valeur vient de la fonction de coût OPUS, réécrite ici d\u2019après sa spécification publiée. Elle réunit le prix de la mise en orbite, le budget de delta-v qu\u2019il faut dépenser pour tenir sa position contre la traînée, et les années de service sacrifiées à la manœuvre de désorbitation finale. Elle varie avec l\u2019altitude, et c\u2019est ce qui permet d\u2019établir un prix couche par couche.',
 m4n:'Réécrire ce code a fait apparaître une incohérence d\u2019unités dans la version publiée d\u2019OPUS, qui calcule le delta-v de traînée en km/s avant d\u2019y ajouter une marge exprimée en m/s. La présente implémentation suit le tableau 2 de l\u2019article, en mètres par seconde d\u2019un bout à l\u2019autre, et se recoupe avec une grandeur extérieure connue. Elle annonce 59 m/s par an de compensation de traînée à 400 km, quand la NASA fait état de 35 à 40 m/s par an pour le rehaussement de la Station spatiale internationale. Les deux ne se comparent pas terme à terme, le satellite de référence ayant un coefficient balistique plus faible que la station et devant donc en dépenser un peu plus. C\u2019est un contrôle d\u2019ordre de grandeur, pas une concordance.',
 m5h:'La redevance',
 m5a:'La redevance pigouvienne, c\u2019est le coût qu\u2019un satellite fait porter aux autres sans jamais le payer. Ajouter un engin dans une couche relève la probabilité de collision pour tous ceux qui s\u2019y trouvent déjà, et cela par les deux canaux en même temps.',
 m6h:'Les contrôles automatiques',
 m6a:'La chaîne enchaîne 29 contrôles répartis sur quatre étapes et refuse d\u2019aller plus loin si l\u2019un d\u2019eux tombe. Quatre erreurs de fond ont été prises de cette façon. L\u2019une rangeait les 1 895 charges utiles abandonnées de cette tranche d\u2019altitude du mauvais côté de l\u2019équation de risque. Une autre datait les fragments du lancement de leur objet parent plutôt que de la fragmentation qui les avait produits, ce qui gonflait les effectifs historiques d\u2019un facteur 2,6.',
 m6b:'La reconstruction historique se confronte à la série publiée par Rao, Burgess et Kaffine pour 1957 à 2015. Sur 1990 à 2015, l\u2019accord médian s\u2019établit à 0,96 pour les charges utiles en orbite et à 1,26 pour les fragments.',

 l0h:'Ce que ce travail ne fait pas',
 l0s:'Les limites sont données en entier, parce qu\u2019un chiffre ne vaut rien sans les hypothèses qui l\u2019ont produit.',
 l1h:'Ce n\u2019est pas un outil de suivi en temps réel',
 l1a:'GCAT publie l\u2019altitude et l\u2019inclinaison de chaque objet, mais ni l\u2019orientation de son plan orbital, ni sa position sur ce plan à un instant donné. Les satellites affichés se trouvent bien à leur altitude et à leur inclinaison réelles, en revanche leur place le long de l\u2019orbite n\u2019est là qu\u2019à titre d\u2019illustration. Il s\u2019agit d\u2019une image de la façon dont l\u2019espace orbital est occupé, pas d\u2019un flux en direct. Les altitudes sont par ailleurs exagérées, faute de quoi toute l\u2019orbite basse formerait sur le globe une pellicule trop fine pour se voir.',
 l2h:'L\u2019estimation est un plancher',
 l2a:'Le canal de persistance de la pollution décrit par Rao et Rondina en 2025, celui des fragments nés des collisions futures entre débris et de l\u2019emballement qui mène au syndrome de Kessler, n\u2019est pas tarifé ici. L\u2019ajouter ne pourrait que faire monter le chiffre.',
 l3h:'Le calcul ne vaut que pour une date',
 l3a:'Tout repose sur un seul état du catalogue. Impossible dans ces conditions de retrouver les projections à 2040 des travaux publiés, qui supposent de modéliser la façon dont les lancements eux-mêmes réagissent au risque.',
 l4h:'Les orbites elliptiques sont simplifiées',
 l4a:'Chaque objet est rangé dans la couche où tombe son altitude moyenne. Or près d\u2019un tiers des objets suivis en orbite basse sont assez excentriques pour traverser plusieurs couches de 35 km, et aucune pondération par temps de séjour n\u2019a été appliquée.',
 l5h:'Les débris non suivis sont supposés, pas mesurés',
 l5a:'Le facteur de dix objets létaux non suivis par objet catalogué est repris de MOCAT 4S sans nouvelle estimation, et la redevance varie proportionnellement à lui.',
 l6h:'Un seul satellite tient lieu de tous les autres',
 l6a:'La fonction de coût est calibrée sur un satellite type de 223 kg, si bien qu\u2019un engin de trois tonnes et un cubesat sont traités de la même façon.',

function L(){ return TXT[LANG]; }

/* ---------------- derived ---------------- */
var TOP3 = D.operators.slice(0,3);
var TOP3SUM = TOP3.reduce(function(a,o){ return a+o.taxTotal; },0);
var RESTN = D.operators.length - 3;
var RESTSUM = D.operators.slice(3).reduce(function(a,o){ return a+o.taxTotal; },0);
var PEAK = D.shells.reduce(function(a,b){ return b.D>a.D ? b : a; }, D.shells[0]);
var MAXD = PEAK.D;
var MAXTAX = D.shells.reduce(function(a,s){ return Math.max(a,s.tax); },0);
var CONG = V.kineticTax*V.congestionShare, POLL = V.kineticTax-CONG;
function altRange(s){ return s.lo + (LANG==='fr'?' à ':' to ') + s.hi + ' km'; }
function altBetween(s){ return s.lo + (LANG==='fr'?' et ':' and ') + s.hi + ' km'; }

/* ---------------- static text ---------------- */
function applyStatic(){
  document.documentElement.lang = LANG;
  var t = L();
  var els = document.querySelectorAll('[data-i]');
  for(var i=0;i<els.length;i++){
    var v = t[els[i].getAttribute('data-i')];
    if(typeof v === 'string') els[i].innerHTML = v;
  }
  document.getElementById('op-search').placeholder = t.searchPh;
  document.getElementById('foot').innerHTML = t.foot(snapDate());
  document.getElementById('m1n').innerHTML = t.m1n(snapDate());
  document.getElementById('eq1').innerHTML =
    '\u03BB = (\u03B4 + \u03B1) \u00D7 (D / V) \u00D7 \u03C3 \u00D7 v<span class="c">'+t.eq1c+'</span>';
  document.getElementById('eq2').innerHTML = 'P = 1 \u2212 e<sup>\u2212\u03BB</sup>';
}

/* ---------------- dynamic text ---------------- */
function renderAll(){
  var t = L();
  document.getElementById('snap').textContent = snapDate();
  document.getElementById('bigfig').textContent = money(T.externalCostUsdYear);

  /* --- band 1 : simulator --- */
  drawPresets(); drawSim();

  /* --- band 2 : per shell simulator --- */
  drawShell();

  /* --- band 3 : podium --- */
  document.getElementById('rank-sub').textContent =
    t.rankSub(num(D.operators.length), pct(TOP3SUM/T.externalCostUsdYear,1), money(TOP3SUM));
  document.getElementById('podium').innerHTML = TOP3.map(function(o,i){
    var share = o.taxTotal/T.externalCostUsdYear;
    return '<div class="pod'+(i===0?' first':'')+'" data-op="'+i+'" role="button" tabindex="0">'+
      '<div class="pod-r">'+(i+1<10?'0':'')+(i+1)+'</div>'+
      '<div class="pod-n">'+tidy(o.name)+'</div>'+
      '<div class="pod-c">'+(o.country||'')+'</div>'+
      '<div class="pod-v">'+money(o.taxTotal)+'</div>'+
      '<div class="pod-u">'+t.rankPerYear+'</div>'+
      '<div class="pod-track"><div class="pod-fill" style="width:'+(share*100).toFixed(1)+'%"></div></div>'+
      '<div class="pod-share">'+pct(share,1)+' '+t.rankShare+'</div>'+
      '<dl class="pod-rows">'+
        '<dt>'+t.rankSats+'</dt><dd>'+num(o.n)+'</dd>'+
        '<dt>'+t.rankPerSat+'</dt><dd>'+money(o.taxPerSat)+'</dd>'+
        '<dt>'+t.rankAlt+'</dt><dd>'+Math.round(o.altMean)+' km</dd>'+
      '</dl></div>';
  }).join('');
  document.getElementById('rest').innerHTML =
    '<span class="l">'+t.rankRest+'</span>'+
    '<span class="s">'+t.rankRestN(num(RESTN))+'</span>'+
    '<span class="v">'+money(RESTSUM)+'</span>'+
    '<span class="s">'+pct(RESTSUM/T.externalCostUsdYear,1)+' '+t.rankShare+'</span>';

  /* --- band 2 : shell strip --- */
  document.getElementById('dirty-sub').textContent =
    t.dirtySub(altBetween(PEAK), num(PEAK.D), num(PEAK.S), dec(PEAK.D/Math.max(PEAK.S,1),1));
  document.getElementById('strip').innerHTML = D.shells.map(function(s){
    var h = Math.max(1, Math.round(s.D/MAXD*100));
    return '<div class="sb'+(s.k===PEAK.k?' max':'')+'" data-k="'+s.k+'" role="button" tabindex="0" '+
           'title="'+altRange(s)+' \u00B7 '+num(s.D)+' '+t.rInert+'" style="height:'+h+'%"></div>';
  }).join('');
  document.getElementById('peak-v').textContent = num(PEAK.D);
  document.getElementById('peak-u').textContent = t.dirtyInert;
  document.getElementById('peak-rows').innerHTML =
    '<dt>'+t.dirtyAlt+'</dt><dd>'+altRange(PEAK)+'</dd>'+
    '<dt>'+t.dirtyActive+'</dt><dd>'+num(PEAK.S)+'</dd>'+
    '<dt>'+t.dirtyRatio+'</dt><dd>'+dec(PEAK.D/Math.max(PEAK.S,1),1)+'</dd>'+
    '<dt>'+t.dirtyProb+'</dt><dd>'+pct(PEAK.prob,4)+'</dd>'+
    '<dt>'+t.dirtyTax+'</dt><dd>'+money(PEAK.tax)+'</dd>';

  /* --- band 3 : split --- */
  document.getElementById('split').innerHTML =
    '<div class="spl a"><div class="l">'+t.splitA+'</div><div class="v">'+money(CONG)+'</div>'+
      '<div class="m">'+pct(V.congestionShare,2)+'</div><div class="d">'+t.splitAd+'</div></div>'+
    '<div class="spl b"><div class="l">'+t.splitB+'</div><div class="v">'+money(POLL)+'</div>'+
      '<div class="m">'+pct(1-V.congestionShare,2)+'</div><div class="d">'+t.splitBd+'</div></div>';

  /* --- findings --- */
  var sl = t.sLabels;
  document.getElementById('stat-strip').innerHTML = [
    ['c', money(T.externalCostUsdYear), sl[0]],
    ['t', num(T.activeSatellites), sl[1]],
    ['t', num(T.inertObjects), sl[2]],
    ['c', money(T.meanTaxPerSat), sl[3]],
    ['c', money(T.maxShellTax), sl[4].replace('ALT', T.maxShellAlt)],
    ['t', num(T.operators), sl[5]]
  ].map(function(r){ return '<div class="stat"><div class="v '+r[0]+'">'+r[1]+'</div><div class="l">'+r[2]+'</div></div>'; }).join('');

  document.getElementById('channel-rows').innerHTML = [
    [t.cLabels[0], CONG, V.congestionShare],
    [t.cLabels[1], POLL, 1-V.congestionShare],
    [t.cLabels[2], V.kineticTax, 1]
  ].map(function(r,i){
    return '<tr><td'+(i===2?' style="font-weight:600;color:var(--ink)"':'')+'>'+r[0]+'</td>'+
           '<td class="num hi">'+money(r[1])+'</td><td class="num">'+pct(r[2],2)+'</td></tr>';
  }).join('');

  document.getElementById('valid-rows').innerHTML = [
    [t.vLabels[0], V.kineticTax],[t.vLabels[1], V.raoTax],[t.vLabels[2], V.raoPublishedExtrapolated]
  ].map(function(r){ return '<tr><td>'+r[0]+'</td><td class="num hi">'+money(r[1])+'</td></tr>'; }).join('');

  document.getElementById('f3a').innerHTML = t.f3a(pct(V.raoProb,2), pct(V.kineticProb,4));

  var o1 = D.operators[0], o2 = D.operators[1];
  document.getElementById('conc-text').innerHTML = t.concText(
    tidy(o1.name), num(o1.n), num(T.activeSatellites), pct(T.topOperatorShare,1),
    money(o1.taxTotal), money(o2.taxTotal), money(o1.taxPerSat), money(o2.taxPerSat));

  /* --- tables --- */
  document.getElementById('shell-rows').innerHTML = D.shells.map(function(s){
    return '<tr><td class="num">'+s.k+'</td><td class="num">'+altRange(s)+'</td>'+
      '<td class="num">'+num(s.S)+'</td><td class="num">'+num(s.D)+'</td>'+
      '<td class="num">'+pct(s.prob,4)+'</td><td class="num">'+money(s.taxCongestion)+'</td>'+
      '<td class="num">'+money(s.taxPollution)+'</td><td class="num hi">'+money(s.tax)+'</td></tr>';
  }).join('');
  drawOps(document.getElementById('op-search').value);

  /* --- ladder --- */
  document.getElementById('rungs').innerHTML = D.shells.slice().reverse().map(function(s){
    var w = Math.max(3, Math.round(Math.pow(s.tax/MAXTAX,0.45)*116));
    return '<div class="rung'+(s.k===selShell?' sel':'')+'" data-k="'+s.k+'" role="button" tabindex="0" '+
      'title="'+altRange(s)+' \u00B7 '+money(s.tax)+'"><span class="alt">'+s.lo+'</span>'+
      '<span class="bar" style="width:'+w+'px"></span></div>';
  }).join('');

  /* --- isolate button --- */
  document.getElementById('btn-iso').textContent =
    isoOp===null ? L().isoOn(shortName(D.operators[0].name)) : L().isoOff;

  refreshInspector();
}

function drawOps(q){
  var t = L();
  var f = q ? D.operators.filter(function(o){
    return (o.name+' '+o.code+' '+(o.country||'')).toLowerCase().indexOf(q.toLowerCase())>=0;
  }) : D.operators;
  document.getElementById('op-rows').innerHTML = f.slice(0,300).map(function(o){
    return '<tr><td>'+tidy(o.name)+'</td><td style="color:var(--faint)">'+(o.country||'')+'</td>'+
      '<td class="num">'+num(o.n)+'</td><td class="num">'+Math.round(o.altMean)+' km</td>'+
      '<td class="num">'+money(o.taxPerSat)+'</td><td class="num hi">'+money(o.taxTotal)+'</td></tr>';
  }).join('');
  document.getElementById('op-count').textContent =
    f.length>300 ? t.opCount(num(300), num(f.length)) : t.opCount(num(f.length), null);
}


/* ---------------- fleet size simulator ---------------- */
var SIM_MIN=1000, SIM_MAX=60000, SIM_NOW=T.activeSatellites;
var SIM_PRESETS=[SIM_NOW, 30000, 45000, 60000];
var simN = SIM_NOW;
function simCost(n){ var f=n/SIM_NOW; return T.externalCostUsdYear*f*f; }
function simPer(n){ return (T.externalCostUsdYear/SIM_NOW)*(n/SIM_NOW); }

function simCurve(n){
  var t=L(), x0=54, x1=408, y0=236, y1=26, CMAX=simCost(SIM_MAX), i, v, y, g='';
  function X(a){ return x0 + (a/SIM_MAX)*(x1-x0); }
  function Y(c){ return y0 - (c/CMAX)*(y0-y1); }
  var MONO='IBM Plex Mono, ui-monospace, monospace';
  for(i=1;i<=4;i++){
    y = Y(CMAX*i/4);
    g += '<line x1="'+x0+'" y1="'+y.toFixed(1)+'" x2="'+x1+'" y2="'+y.toFixed(1)+'" stroke="#16233A"/>'

var RE_KM = 6378.1366, SH_MAXN = 10000;
var MODEL = D.model || {A:22.01028, B:7050.615};
var shK = D.shells.map(function(x){ return (x.kc||0) + (x.kp||0); });
var shSel = 8, shN = D.shells[7].S;
function shVol(k){ var x=D.shells[k-1];
  return 4/3*Math.PI*(Math.pow(RE_KM+x.hi,3)-Math.pow(RE_KM+x.lo,3)); }
function shTax(k,n){ return shK[k-1]*n; }
function shTotal(k,n){ return shK[k-1]*n*n; }
function shProb(k,n){
  var x=D.shells[k-1];
  var lam=(MODEL.A*Math.max(0,n-1)+MODEL.B*x.D)/shVol(k);
  return 1-Math.exp(-lam);
}
function niceMax(v){
  if(v<=0) return 1;
  var e=Math.pow(10,Math.floor(Math.log10(v)));
  return Math.ceil(v/e)*e;
}
function shCurve(){
  var t=L(), x0=46, x1=408, y0=228, y1=26, i, g='';
  var MONO='IBM Plex Mono, ui-monospace, monospace';
  var base = D.shells.map(function(x){ return x.tax; });
  var vals = D.shells.map(function(x,j){ return (j+1===shSel) ? shTax(shSel,shN) : x.tax; });
  var vmax = niceMax(Math.max(Math.max.apply(null,vals), Math.max.apply(null,base)));
  function Y(v){ return y0 - (v/vmax)*(y0-y1); }
  var bw = (x1-x0)/40;
  for(i=1;i<=4;i++){
    var y = Y(vmax*i/4);
    g += '<line x1="'+x0+'" y1="'+y.toFixed(1)+'" x2="'+x1+'" y2="'+y.toFixed(1)+'" stroke="#16233A"/>'
      +  '<text x="'+(x0-8)+'" y="'+(y+3.4).toFixed(1)+'" text-anchor="end" fill="#5C6E88" font-family="'+MONO+'" font-size="8.5">'+moneyShort(vmax*i/4)+'</text>';
  }
  for(i=0;i<40;i++){
    var x = x0 + i*bw, w = Math.max(1.5, bw-1.8);
    var hv = Y(vals[i]), hb = Y(base[i]), sel = (i+1===shSel);
    g += '<rect x="'+x.toFixed(1)+'" y="'+hv.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0.6,y0-hv).toFixed(1)+'" fill="'+(sel?'#6AA0FF':'#1B4276')+'"/>';
    if(sel && Math.abs(vals[i]-base[i])>0.5){
      g += '<rect x="'+x.toFixed(1)+'" y="'+hb.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0.6,y0-hb).toFixed(1)+'" fill="none" stroke="#5C6E88" stroke-dasharray="2 2"/>';
    }
  }
  g += '<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" stroke="#25384F"/>';
  [[0,'200'],[10,'550'],[20,'900'],[30,'1250'],[40,'1600']].forEach(function(p){
    g += '<text x="'+(x0+p[0]*bw).toFixed(1)+'" y="'+(y0+16)+'" text-anchor="middle" fill="#5C6E88" font-family="'+MONO+'" font-size="8.5">'+num(parseInt(p[1],10))+'</text>';
  });
  g += '<text x="'+((x0+x1)/2).toFixed(1)+'" y="262" text-anchor="middle" fill="#5C6E88" font-family="'+MONO+'" font-size="8.5" letter-spacing="1">'+t.shCurveX+'</text>';
  return '<svg viewBox="0 0 420 272" role="img" aria-label="'+t.shCurveX+'">'+g+'</svg>';
}

var RE = 1.0, ALT_GAIN = 5.2, DMIN = 1.62, DMAX = 9.4, D0 = 4.25;
var stage = document.getElementById('stage');
var renderer, scene, camera, points, ringGroup, raycaster, W=1, H=1;
var selShell = null, isoOp = null;
var rotX=0.30, rotY=0.62, rotXT=0.30, rotYT=0.62;
var dist=D0*1.8, distT=D0;
var dragging=false, lx=0, ly=0, moved=0, lastAct=-1e9;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mark(){ lastAct = performance.now(); }

var EARTH_VS = [
 'varying vec3 vW; varying vec3 vN; varying vec3 vP;',
 'void main(){',
 '  vW = normalize(mat3(modelMatrix) * normal);',
 '  vN = normalize(normalMatrix * normal);',
 '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
 '  vP = mv.xyz;',
 '  gl_Position = projectionMatrix * mv;',
 '}'].join('\n');
var EARTH_FS = [
 'uniform vec3 cLow; uniform vec3 cHigh; uniform vec3 cRim; uniform vec3 sun;',
 'varying vec3 vW; varying vec3 vN; varying vec3 vP;',
 'void main(){',
 '  float lam = max(dot(normalize(vW), normalize(sun)), 0.0);',
 '  float sh = smoothstep(0.02, 0.92, lam);',
 '  vec3 base = mix(cLow, cHigh, sh);',
 '  float fres = pow(1.0 - max(dot(normalize(vN), normalize(-vP)), 0.0), 3.0);',
 '  base += cRim * fres * (0.45 + 0.75 * sh);',
 '  gl_FragColor = vec4(base, 1.0);',
 '}'].join('\n');
var ATMO_VS = [
 'varying vec3 vN; varying vec3 vP; varying vec3 vW;',
 'void main(){',
 '  vW = normalize(mat3(modelMatrix) * normal);',
 '  vN = normalize(normalMatrix * normal);',
 '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
 '  vP = mv.xyz;',
 '  gl_Position = projectionMatrix * mv;',
 '}'].join('\n');
var ATMO_FS = [
 'uniform vec3 c; uniform vec3 sun;',
 'varying vec3 vN; varying vec3 vP; varying vec3 vW;',
 'void main(){',
 '  float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), 2.4);',
 '  float lam = max(dot(normalize(vW), normalize(sun)), 0.0);',
 '  gl_FragColor = vec4(c, f * (0.16 + 0.58 * smoothstep(0.0, 0.9, lam)));',
 '}'].join('\n');

function graticule(R){
  var pts=[], seg=140, i, a, b, lat, lon, p, r, y, t;
  for(lat=-75; lat<=75; lat+=15){
    p = lat*Math.PI/180; r = Math.cos(p)*R; y = Math.sin(p)*R;
    for(i=0;i<seg;i++){
      a = i/seg*Math.PI*2; b = (i+1)/seg*Math.PI*2;
      pts.push(r*Math.cos(a), y, r*Math.sin(a), r*Math.cos(b), y, r*Math.sin(b));
    }
  }
  for(lon=0; lon<180; lon+=15){
    t = lon*Math.PI/180;
    for(i=0;i<seg;i++){
      a = i/seg*Math.PI*2; b = (i+1)/seg*Math.PI*2;
      pts.push(R*Math.cos(a)*Math.cos(t), R*Math.sin(a), R*Math.cos(a)*Math.sin(t),
               R*Math.cos(b)*Math.cos(t), R*Math.sin(b), R*Math.cos(b)*Math.sin(t));
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color:0x1C4066, transparent:true, opacity:0.5, depthWrite:false
  }));
}

function starfield(){
  var n=1500, pos=new Float32Array(n*3), col=new Float32Array(n*3), i, u, th, s, R=42, br;
  var sd = 991; function rr(){ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; }
  for(i=0;i<n;i++){
    u = rr()*2-1; th = rr()*Math.PI*2; s = Math.sqrt(1-u*u);
    pos[i*3]=R*s*Math.cos(th); pos[i*3+1]=R*u; pos[i*3+2]=R*s*Math.sin(th);
    br = 0.16 + Math.pow(rr(),2.2)*0.72;
    col[i*3]=br*0.78; col[i*3+1]=br*0.86; col[i*3+2]=br;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    size:1.35, sizeAttenuation:false, vertexColors:true,
    transparent:true, opacity:0.85, depthWrite:false
  }));
}

var ux,uy,uz,vx,vy,vz,rad,omega,ph0,colr;
var C_BASE=[0.36,0.58,0.94], C_HOT=[1.0,1.0,1.0], C_MUTE=[0.055,0.10,0.17];

function buildPoints(){
  ux=new Float32Array(N); uy=new Float32Array(N); uz=new Float32Array(N);
  vx=new Float32Array(N); vy=new Float32Array(N); vz=new Float32Array(N);
  rad=new Float32Array(N); omega=new Float32Array(N); ph0=new Float32Array(N);
  var pos=new Float32Array(N*3), col=new Float32Array(N*3);
  colr = col;
  var seed = 20260802;
  function rnd(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
  for(var i=0;i<N;i++){
    var alt=S.alt[i], inc=S.inc[i]*Math.PI/180, raan=rnd()*Math.PI*2;
    rad[i] = RE + (alt/6378.1366)*ALT_GAIN;
    omega[i] = 0.28/Math.pow(rad[i],1.5);
    ph0[i] = rnd()*Math.PI*2;
    var cr=Math.cos(raan), sr=Math.sin(raan), ci=Math.cos(inc), si=Math.sin(inc);
    ux[i]=cr;    uy[i]=0;  uz[i]=-sr;
    vx[i]=sr*ci; vy[i]=si; vz[i]=cr*ci;
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  points = new THREE.Points(g, new THREE.PointsMaterial({
    size:0.0175, vertexColors:true, transparent:true, opacity:0.95,
    sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  scene.add(points);
  recolor();
}
function shellOf(i){
  if(S.sh && S.sh.length===N) return S.sh[i];     /* exact index from the pipeline */
  return Math.min(40, Math.max(1, Math.floor((S.alt[i]-200)/35)+1));
}
function recolor(){
  if(!points) return;
  for(var i=0;i<N;i++){
    var c = C_BASE;
    if(isoOp!==null) c = (S.op[i]===isoOp) ? C_HOT : C_MUTE;
    else if(selShell!==null) c = (shellOf(i)===selShell) ? C_HOT : C_MUTE;
    colr[i*3]=c[0]; colr[i*3+1]=c[1]; colr[i*3+2]=c[2];
  }
  points.geometry.attributes.color.needsUpdate = true;
}

function init3D(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  stage.appendChild(renderer.domElement);

  var earth = new THREE.Group();
  earth.add(new THREE.Mesh(
    new THREE.SphereGeometry(RE, 96, 64),
    new THREE.ShaderMaterial({
      vertexShader:EARTH_VS, fragmentShader:EARTH_FS,
      uniforms:{
        cLow:{value:new THREE.Color(0x050A12)},
        cHigh:{value:new THREE.Color(0x123253)},
        cRim:{value:new THREE.Color(0x2A5F9E)},
        sun:{value:new THREE.Vector3(-0.62,0.40,0.68).normalize()}
      }
    })
  ));
  earth.add(graticule(RE*1.0015));
  earth.add(new THREE.Mesh(
    new THREE.SphereGeometry(RE*1.055, 72, 48),
    new THREE.ShaderMaterial({
      vertexShader:ATMO_VS, fragmentShader:ATMO_FS,
      uniforms:{ c:{value:new THREE.Color(0x3E86E0)}, sun:{value:new THREE.Vector3(-0.62,0.40,0.68).normalize()} },
      side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    })
  ));
  scene.add(earth);
  scene.add(starfield());

  ringGroup = new THREE.Group();
  scene.add(ringGroup);

  buildPoints();

  raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 0.021;

  onResize();
  window.addEventListener('resize', onResize);
  if(window.ResizeObserver){ new ResizeObserver(onResize).observe(stage); }
  animate();
}

var sized = false;
function onResize(){
  if(!renderer) return;
  var w = stage.clientWidth||1, h = stage.clientHeight||1;
  if(sized && w===W && h===H) return;
  sized = true; W=w; H=h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(w, h);
  camera.aspect = w/h;
  var f = w>=1280 ? 0.185 : w>=1100 ? 0.15 : w>=901 ? 0.09 : 0;
  if(f>0) camera.setViewOffset(w, h, -Math.round(w*f), 0, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}

var t0 = performance.now(), intro = 0;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(){
  requestAnimationFrame(animate);
  var t = (performance.now()-t0)/1000;
  var arr = points.geometry.attributes.position.array;
  for(var i=0;i<N;i++){
    var th = ph0[i] + omega[i]*t*12, c=Math.cos(th), s=Math.sin(th), R=rad[i];
    arr[i*3]   = R*(c*ux[i] + s*vx[i]);
    arr[i*3+1] = R*(c*uy[i] + s*vy[i]);
    arr[i*3+2] = R*(c*uz[i] + s*vz[i]);
  }
  points.geometry.attributes.position.needsUpdate = true;

  if(intro < 1){
    intro = REDUCED ? 1 : Math.min(1, (performance.now()-t0)/1500);
    points.material.opacity = 0.95 * (intro*intro);
  }
  if(!dragging && performance.now()-lastAct > 5000) rotYT += 0.00042;
  rotX += (rotXT-rotX)*0.12;
  rotY += (rotYT-rotY)*0.12;
  dist += (distT-dist)*0.11;

  camera.position.set(
    dist*Math.cos(rotX)*Math.sin(rotY),
    dist*Math.sin(rotX),
    dist*Math.cos(rotX)*Math.cos(rotY)
  );
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}

/* ---------------- interaction ---------------- */
stage.addEventListener('pointerdown', function(e){
  if(e.button && e.button!==0) return;
  dragging=true; moved=0; lx=e.clientX; ly=e.clientY;
  stage.classList.add('grabbing');
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  mark();
});
stage.addEventListener('pointermove', function(e){
  if(!dragging) return;
  var dx=e.clientX-lx, dy=e.clientY-ly;
  lx=e.clientX; ly=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  rotYT -= dx*0.0055;
  rotXT = clamp(rotXT + dy*0.0055, -1.28, 1.28);
  mark();
});
function endDrag(e){
  if(!dragging) return;
  dragging=false; stage.classList.remove('grabbing');
  try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
  mark();
  if(moved < 6) pick(e);
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointerleave', function(){ if(dragging){ dragging=false; stage.classList.remove('grabbing'); } });
stage.addEventListener('pointercancel', function(){ dragging=false; stage.classList.remove('grabbing'); });

stage.addEventListener('wheel', function(e){
  if(window.scrollY > 6) return;
  if(e.deltaY > 0 && distT >= DMAX-0.002) return;
  e.preventDefault();
  var unit = e.deltaMode===1 ? 18 : e.deltaMode===2 ? H : 1;
  distT = clamp(distT * Math.exp(e.deltaY*unit*0.0012), DMIN, DMAX);
  mark();
}, {passive:false});

document.getElementById('z-in').addEventListener('click', function(){ distT=clamp(distT*0.78,DMIN,DMAX); mark(); });
document.getElementById('z-out').addEventListener('click', function(){ distT=clamp(distT*1.28,DMIN,DMAX); mark(); });
document.getElementById('z-reset').addEventListener('click', function(){
  distT=D0; rotXT=0.30; rotYT=0.62; mark();
});

function pick(e){
  var r = renderer.domElement.getBoundingClientRect();
  var m = new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(m, camera);
  var hits = raycaster.intersectObject(points);
  if(hits.length){
    var best = hits[0];
    for(var i=1;i<hits.length;i++){ if(hits[i].distanceToRay < best.distanceToRay) best = hits[i]; }
    cur = {kind:'sat', i:best.index};
    refreshInspector();
    var h = document.getElementById('hint'); if(h) h.style.opacity = 0;
  }
}

/* ---------------- inspector ---------------- */
var cur = null;
var inspect = document.getElementById('inspect');
document.getElementById('ins-close').addEventListener('click', function(){
  cur=null; inspect.classList.remove('on');
});
function refreshInspector(){
  if(!cur){ inspect.classList.remove('on'); return; }
  var hh = document.getElementById('hint'); if(hh) hh.style.opacity = 0;
  if(cur.kind==='sat') showSat(cur.i);
  else if(cur.kind==='shell') showShell(cur.k);
  else if(cur.kind==='op') showOp(cur.i);
}
function showSat(i){
  var t=L(), op=D.operators[S.op[i]], k=shellOf(i), sh=D.shells[k-1];
  var yr = S.yr[i]>=0 ? (S.yr[i]+1957) : null;
  document.getElementById('ins-kind').textContent = t.kSat+' \u00B7 '+t.kShell.toLowerCase()+' '+k;
  document.getElementById('ins-body').innerHTML =
    '<div class="sat-name">'+NAMES[i]+'</div>'+
    '<div class="sat-op">'+tidy(op.name)+(op.country?' \u00B7 '+op.country:'')+'</div>'+
    '<dl class="rows">'+
      '<dt>'+t.rAlt+'</dt><dd>'+S.alt[i]+' km</dd>'+
      '<dt>'+t.rInc+'</dt><dd>'+S.inc[i]+'\u00B0</dd>'+
      (yr?'<dt>'+t.rLaunched+'</dt><dd>'+yr+'</dd>':'')+
      '<dt>'+t.rShellPop+'</dt><dd>'+num(sh.S)+' '+t.rActive+' \u00B7 '+num(sh.D)+' '+t.rInert+'</dd>'+
      '<dt>'+t.rRisk+'</dt><dd>'+pct(sh.prob,4)+t.perYear+'</dd>'+
      '<dt>'+t.rValue+'</dt><dd>'+money(sh.cost)+'</dd>'+
      '<dt><strong>'+t.rTaxSat+'</strong></dt><dd class="hi"><strong>'+money(sh.tax)+t.perYear+'</strong></dd>'+
    '</dl><div class="divider"></div>'+
    '<div class="op-cap">'+t.rFleet(tidy(op.name))+'</div>'+
    '<div class="op-tot">'+money(op.taxTotal)+'</div>'+
    '<dl class="rows" style="margin-top:12px">'+
      '<dt>'+t.rSats+'</dt><dd>'+num(op.n)+'</dd>'+
      '<dt>'+t.rMeanAlt+'</dt><dd>'+Math.round(op.altMean)+' km</dd>'+
      '<dt>'+t.rAvg+'</dt><dd>'+money(op.taxPerSat)+t.perYear+'</dd>'+
      '<dt>'+t.rShare+'</dt><dd class="hi">'+pct(op.taxTotal/T.externalCostUsdYear,2)+'</dd>'+
    '</dl>';
  inspect.classList.add('on');
}
function showShell(k){
  var t=L(), sh=D.shells[k-1];
  document.getElementById('ins-kind').textContent = t.kShell+' '+k;
  document.getElementById('ins-body').innerHTML =
    '<div class="sat-name">'+altRange(sh)+'</div>'+
    '<div class="sat-op">'+num(sh.S)+' '+t.rActive+' \u00B7 '+num(sh.D)+' '+t.rInert+'</div>'+
    '<dl class="rows">'+
      '<dt>'+t.rRisk+'</dt><dd>'+pct(sh.prob,4)+t.perYear+'</dd>'+
      '<dt>'+t.rDensity+'</dt><dd>'+sh.density.toExponential(2)+' /km\u00B3</dd>'+
      '<dt>'+t.rValue+'</dt><dd>'+money(sh.cost)+'</dd>'+
      '<dt>'+t.rCong+'</dt><dd>'+money(sh.taxCongestion)+t.perYear+'</dd>'+
      '<dt>'+t.rPoll+'</dt><dd>'+money(sh.taxPollution)+t.perYear+'</dd>'+
      '<dt><strong>'+t.rTaxPer+'</strong></dt><dd class="hi"><strong>'+money(sh.tax)+t.perYear+'</strong></dd>'+
    '</dl>';
  inspect.classList.add('on');
}
function showOp(i){
  var t=L(), o=D.operators[i];
  document.getElementById('ins-kind').textContent = t.kOperator;
  document.getElementById('ins-body').innerHTML =
    '<div class="sat-name">'+tidy(o.name)+'</div>'+
    '<div class="sat-op">'+(o.country||'')+'</div>'+
    '<div class="op-cap" style="margin-top:14px">'+t.rExternal+'</div>'+
    '<div class="op-tot">'+money(o.taxTotal)+'</div>'+
    '<dl class="rows" style="margin-top:14px">'+
      '<dt>'+t.rSats+'</dt><dd>'+num(o.n)+'</dd>'+
      '<dt>'+t.rShareAll+'</dt><dd>'+pct(o.n/T.activeSatellites,1)+'</dd>'+
      '<dt>'+t.rShareCost+'</dt><dd class="hi">'+pct(o.taxTotal/T.externalCostUsdYear,1)+'</dd>'+
      '<dt>'+t.rMeanAlt+'</dt><dd>'+Math.round(o.altMean)+' km</dd>'+
      '<dt>'+t.rTaxPer+'</dt><dd>'+money(o.taxPerSat)+t.perYear+'</dd>'+
    '</dl>';
  inspect.classList.add('on');
}

/* ---------------- selection ---------------- */
function markRungs(){
  var rs = document.getElementById('rungs').children;
  for(var i=0;i<rs.length;i++) rs[i].classList.toggle('sel', parseInt(rs[i].dataset.k,10)===selShell);
}
function selectShell(k){
  isoOp = null;
  selShell = (selShell===k) ? null : k;
  markRungs();
  recolor();
  if(ringGroup) ringGroup.clear();
  document.getElementById('btn-iso').textContent = L().isoOn(shortName(D.operators[0].name));
  if(selShell!==null){
    if(ringGroup){
      var sh = D.shells[selShell-1];
      var R = RE + ((sh.lo+sh.hi)/2/6378.1366)*ALT_GAIN;
      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.0022, 6, 160),
        new THREE.MeshBasicMaterial({color:0x6AA0FF, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false})
      );
      ring.rotation.x = Math.PI/2;
      ringGroup.add(ring);
    }
    cur = {kind:'shell', k:selShell};
  } else { cur = null; }
  refreshInspector();
}
function isolate(i){
  selShell = null; markRungs(); if(ringGroup) ringGroup.clear();
  isoOp = (isoOp===i) ? null : i;
  recolor();
  document.getElementById('btn-iso').textContent =
    isoOp===null ? L().isoOn(shortName(D.operators[0].name)) : L().isoOff;
  cur = isoOp===null ? null : {kind:'op', i:isoOp};
  refreshInspector();
}

document.getElementById('rungs').addEventListener('click', function(e){
  var r = e.target.closest('.rung'); if(!r) return;
  selectShell(parseInt(r.dataset.k,10));
});
document.getElementById('rungs').addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var r = e.target.closest('.rung'); if(!r) return;
  e.preventDefault(); selectShell(parseInt(r.dataset.k,10));
});
document.getElementById('podium').addEventListener('click', function(e){
  var p = e.target.closest('.pod'); if(!p) return;
  isolate(parseInt(p.dataset.op,10));
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('podium').addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var p = e.target.closest('.pod'); if(!p) return;
  e.preventDefault(); isolate(parseInt(p.dataset.op,10));
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('strip').addEventListener('click', function(e){
  var b = e.target.closest('.sb'); if(!b) return;
  selectShell(parseInt(b.dataset.k,10));
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('strip').addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var b = e.target.closest('.sb'); if(!b) return;
  e.preventDefault(); selectShell(parseInt(b.dataset.k,10));
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('btn-iso').addEventListener('click', function(){ isolate(0); });

setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.style.opacity=0; }, 11000);

/* ---------------- go ---------------- */
applyStatic();
renderAll();
if(typeof THREE !== 'undefined'){ init3D(); }
})();
</script>
